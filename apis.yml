aid: o-ran
name: O-RAN
description: >-
  O-RAN supports the Open Radio Access Network architecture under the Linux Foundation for more interoperable and virtualized mobile network infrastructure. It defines open interfaces between RAN components enabling multi-vendor deployments and network intelligence through AI and machine learning.
